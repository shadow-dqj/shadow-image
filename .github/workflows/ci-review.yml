name: CI Review

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

jobs:
  planning-review:
    name: Planning docs, secrets and migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Secret scan
        run: bash scripts/ci/secret-scan.sh

      - name: Documentation check
        run: bash scripts/ci/docs-check.sh

      - name: Migration safety check
        run: bash scripts/ci/migration-check.sh

  scaffold-build-test:
    name: Scaffold-aware build and test
    runs-on: ubuntu-latest
    needs: planning-review
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go when needed
        if: ${{ hashFiles('go.mod', 'server/go.mod') != '' }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true

      - name: Set up Node when needed
        if: ${{ hashFiles('package.json', 'desktop/frontend/package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scaffold-aware build/test
        run: bash scripts/ci/scaffold-build-test.sh
