name: CI Review

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

jobs:
  planning-review:
    name: Planning docs and secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Secret scan
        run: bash scripts/ci/secret-scan.sh

      - name: Documentation check
        run: bash scripts/ci/docs-check.sh

  desktop-build-test:
    name: Desktop frontend build and test
    runs-on: ubuntu-latest
    needs: planning-review
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run desktop frontend build/test
        run: bash scripts/ci/scaffold-build-test.sh
